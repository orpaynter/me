name: Observe public repository traffic

on:
  workflow_dispatch:
  schedule:
    - cron: '41 5 * * *'

permissions:
  contents: read

concurrency:
  group: readme-maintenance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Append public observations and refresh signals
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: |
          node scripts/collect-traffic.mjs
          node scripts/render-stats.mjs --verify-visibility
          node scripts/build-readme.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-traffic
          path: |
            README.md
            assets/svg/signals.svg
            assets/svg/signals-light.svg
            data/traffic/*.json
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: collect
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-traffic
          path: .
      - name: Commit only traffic observations and their rendering
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- README.md assets/svg/signals.svg assets/svg/signals-light.svg
          if test -d data/traffic; then
            find data/traffic -maxdepth 1 -type f -name '*.json' -exec git add -- {} +
          fi
          if git diff --cached --quiet; then
            echo "Traffic outputs unchanged."
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              README.md|assets/svg/signals.svg|assets/svg/signals-light.svg|data/traffic/*.json) ;;
              *) echo "Unexpected staged path"; exit 1 ;;
            esac
          done < <(git diff --cached --name-only)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record public repository traffic" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
