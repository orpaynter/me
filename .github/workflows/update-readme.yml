name: Refresh repository README

on:
  push:
    branches:
      - '**'
    paths:
      - 'data/**'
      - 'templates/**'
      - 'scripts/build-readme.mjs'
      - 'scripts/lib.mjs'
      - '.github/workflows/update-readme.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: readme-maintenance-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Build from verified public activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/build-readme.mjs --fetch-activity
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generated-readme
          path: README.md
          retention-days: 1
          if-no-files-found: error

  commit:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: generated-readme
          path: .
      - name: Commit only a changed README
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add -- README.md
          if git diff --cached --quiet; then
            echo "README unchanged."
            exit 0
          fi
          test "$(git diff --cached --name-only)" = "README.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: refresh verified README activity" -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
