<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="title desc">
  <title id="title">Oliver Paynter — from one roof to governed AI systems</title>
  <desc id="desc">An original roofline continuously morphs into an angular evidence and control circuit graph. AI drafts. You govern. Reduced motion shows a static circuit with its roofing foundation.</desc>
  <style>
    svg{--bg:#f4f8fc;--panel:#e6eef6;--ink:#14263a;--muted:#405975;--line:#71869c;--accent:#086f62;--gold:#925b12;font-family:Arial,Helvetica,sans-serif}
    .morph{animation:morph 10s ease-in-out infinite}.roof{animation:roof 10s ease-in-out infinite}.graph{animation:graph 10s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes morph{0%,15%,90%,100%{d:path("M30 72L65 47.5L100 23L135 47.5L170 72L152 60L152 92L48 92L48 60L30 72")}40%,65%{d:path("M30 72L100 23L170 72L260 72L305 32L398 32L440 72L522 72L567 32L690 32")}}
    @keyframes roof{0%,15%,90%,100%{opacity:1}40%,65%{opacity:.12}}
    @keyframes graph{0%,15%,90%,100%{opacity:.18}40%,65%{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.morph{d:path("M30 72L100 23L170 72L260 72L305 32L398 32L440 72L522 72L567 32L690 32")}.roof{opacity:.55}.graph{opacity:1}.pulse{opacity:1}}
  </style>
  <rect width="800" height="440" rx="24" fill="var(--bg)"/>
  <path d="M28 24H772" stroke="var(--accent)" stroke-width="3"/>
  <text x="36" y="68" font-size="15" letter-spacing="3" fill="var(--muted)">ROOFER FIRST. HUMAN-GOVERNED SYSTEMS.</text>
  <text x="36" y="126" font-size="48" font-weight="700" fill="var(--ink)">Oliver Paynter</text>
  <text x="36" y="174" font-size="30" fill="var(--ink)">From one roof to</text>
  <text x="36" y="212" font-size="30" fill="var(--ink)">governed AI systems</text>
  <g transform="translate(38 244)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="724" height="112" rx="14" fill="var(--panel)"/>
    <path class="morph" d="M30 72L65 47.5L100 23L135 47.5L170 72L152 60L152 92L48 92L48 60L30 72" stroke="var(--accent)" stroke-width="3"/>
    <g class="roof" stroke="var(--accent)" stroke-width="3"><path d="M48 60V92H152V60M115 34V21H135V48"/></g>
    <g class="graph" stroke="var(--accent)" stroke-width="2.5">
      <path d="M100 23V92H216L260 72M305 32V92H398L440 72M522 72V92H625L690 32"/>
      <g fill="var(--panel)"><circle cx="30" cy="72" r="6"/><circle cx="100" cy="23" r="6"/><circle cx="170" cy="72" r="6"/><circle cx="260" cy="72" r="6"/><circle cx="305" cy="32" r="6"/><circle cx="398" cy="32" r="6"/><circle cx="522" cy="72" r="6"/><circle cx="625" cy="92" r="6"/><circle cx="690" cy="32" r="6"/></g>
      <path d="M448 56V48A12 12 0 0 1 472 48V56M443 56H477V83H443Z" fill="var(--panel)" stroke="var(--gold)"/>
    </g>
    <path d="M190 56H234M210 48L220 56L210 64" stroke="var(--line)" stroke-width="2"/>
  </g>
  <g class="pulse"><circle cx="45" cy="395" r="5" fill="var(--accent)"/><text x="62" y="402" font-size="25" font-weight="700" fill="var(--accent)">AI drafts. You govern.</text></g>
  <text x="762" y="402" text-anchor="end" font-size="15" fill="var(--muted)">EVIDENCE · HUMAN GATE · PROOF</text>
</svg>
