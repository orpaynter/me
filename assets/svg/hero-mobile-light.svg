<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 430" role="img" aria-labelledby="title desc">
  <title id="title">Oliver Paynter — from one roof to governed AI systems</title>
  <desc id="desc">Mobile portrait artwork. A roofline continuously morphs into a circuit graph with a fixed human lock. AI drafts. You govern. Reduced motion shows a static circuit and roofing foundation.</desc>
  <style>
    svg{--bg:#f4f8fc;--panel:#e6eef6;--ink:#14263a;--muted:#405975;--accent:#086f62;--gold:#925b12;font-family:Arial,Helvetica,sans-serif}
    .morph{animation:morph 10s ease-in-out infinite}.roof{animation:roof 10s ease-in-out infinite}.graph{animation:graph 10s ease-in-out infinite}.pulse{animation:pulse 4s ease-in-out infinite}
    @keyframes morph{0%,15%,90%,100%{d:path("M18 62L42 42L66 22L90 42L114 62L102 52L102 89L30 89L30 52L18 62")}40%,65%{d:path("M18 62L66 22L114 62L153 62L188 28L239 28L269 62L291 62L311 62L330 62")}}
    @keyframes roof{0%,15%,90%,100%{opacity:1}40%,65%{opacity:.12}}
    @keyframes graph{0%,15%,90%,100%{opacity:.18}40%,65%{opacity:1}}
    @keyframes pulse{0%,100%{opacity:.72}50%{opacity:1}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.morph{d:path("M18 62L66 22L114 62L153 62L188 28L239 28L269 62L291 62L311 62L330 62")}.roof{opacity:.55}.graph{opacity:1}.pulse{opacity:1}}
  </style>
  <rect width="400" height="430" rx="20" fill="var(--bg)"/>
  <path d="M24 24H376" stroke="var(--accent)" stroke-width="3"/>
  <text x="24" y="60" font-size="16" letter-spacing="2" fill="var(--muted)">ROOFER FIRST.</text>
  <text x="24" y="109" font-size="35" font-weight="700" fill="var(--ink)">Oliver Paynter</text>
  <text x="24" y="154" font-size="27" fill="var(--ink)">From one roof to</text>
  <text x="24" y="189" font-size="27" fill="var(--ink)">governed AI systems</text>
  <g transform="translate(24 218)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect width="352" height="106" rx="12" fill="var(--panel)"/>
    <path class="morph" d="M18 62L42 42L66 22L90 42L114 62L102 52L102 89L30 89L30 52L18 62" stroke="var(--accent)" stroke-width="3"/>
    <g class="roof" stroke="var(--accent)" stroke-width="3"><path d="M30 52V89H102V52M77 31V20H90V42"/></g>
    <g class="graph" stroke="var(--accent)" stroke-width="2.5"><path d="M66 22V89H153L188 62M239 28V89H291L330 62"/><g fill="var(--panel)"><circle cx="18" cy="62" r="5"/><circle cx="66" cy="22" r="5"/><circle cx="114" cy="62" r="5"/><circle cx="188" cy="28" r="5"/><circle cx="239" cy="28" r="5"/><circle cx="291" cy="89" r="5"/><circle cx="330" cy="62" r="5"/></g><path d="M259 59V51A10 10 0 0 1 279 51V59M254 59H284V82H254Z" fill="var(--panel)" stroke="var(--gold)"/></g>
  </g>
  <g class="pulse"><circle cx="29" cy="359" r="4" fill="var(--accent)"/><text x="44" y="367" font-size="24" font-weight="700" fill="var(--accent)">AI drafts. You govern.</text></g>
  <text x="24" y="402" font-size="15" fill="var(--muted)">EVIDENCE · HUMAN GATE · PROOF</text>
</svg>
