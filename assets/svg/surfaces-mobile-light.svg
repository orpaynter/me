<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 548" role="img" aria-labelledby="title desc">
  <title id="title">One system. Four controlled surfaces — mobile</title>
  <desc id="desc">Web sells. ClaimFlow proves. ORPA controls. DecisionPackage verifies. Four stacked cards explain the public, workflow, human control, and record surfaces without performance claims.</desc>
